spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000
  h2:
    console:
      enabled: false      
  # sql:
  #   init:
  #     mode: never  # init sql is handled in docker-compose
  jpa:
    hibernate:
      show-sql: true
      ddl-auto: update