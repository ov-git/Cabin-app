version: '3.8'

services:
  db:
    image: mysql
    container_name: cabins_db
    ports:  
    - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: cabins
    volumes:
    - db_data:/var/lib/mysql
    - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"

  backend:
    build: ./backend/Cabin-api
    container_name: cabins_backend
    depends_on:
      - db
        # condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://db:3306/cabins
      DB_USER: user
      DB_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
   
    # healthcheck:
    #   test: ["CMD", "root", "ping", "-h", "localhost"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10

volumes:
    db_data: