version: '3.8'

services:
  db:
    image: mysql:9.6
    container_name: cabins_db
    restart: unless-stopped
    ports:  
    - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-cabins}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
    - db_data:/var/lib/mysql
    - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql #Seed script 
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p ${DB_ROOT_PASSWORD:-root}"]
      # test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
    - "${ADMINER_PORT:-8081}:8080"

  backend:
    build: ./backend/Cabin-api
    container_name: cabins_backend
    restart: unless-stopped
    depends_on:
      - db
        # condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-cabins}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}

volumes:
    db_data: